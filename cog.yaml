image: "registry.app.nz/appnz-kimodo-motion:latest"
build:
  python_version: "3.11"
  gpu: true
  cuda: "12.4"
  system_packages:
    - "cmake"
    - "git"
    - "ninja-build"
  python_packages:
    - "accelerate==1.9.0"
    - "bitsandbytes==0.46.1"
    - "huggingface-hub==0.34.3"
    - "peft==0.17.0"
    - "transformers==4.57.3"
  run:
    - "git clone --filter=blob:none https://github.com/nv-tlabs/kimodo.git /tmp/kimodo && git -C /tmp/kimodo checkout --detach 1aece8c124d73d255ceff5086d983b844c9f4e94 && sed -i 's/-DPYTHON_EXECUTABLE=/-DPython3_EXECUTABLE=/' /tmp/kimodo/setup.py /tmp/kimodo/MotionCorrection/setup.py && python -m pip install --no-deps /tmp/kimodo"
predict: "predict.py:Predictor"
